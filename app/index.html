<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud & DevOps CI/CD</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .container {
            max-width: 700px;
            margin: 20px;
            padding: 45px;
            text-align: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.8;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            border-radius: 25px;
            background: #14532d;
            color: #86efac;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Cloud & DevOps CI/CD</h1>
        <p>A containerized web application built with modern DevOps tools.</p>
        <p>Powered by Docker, Jenkins, GitHub, Terraform and AWS EC2.</p>
        <div class="status">Application Ready</div>
        <footer>Automate. Build. Deploy. Verify.</footer>
    </main>
</body>
</html>
